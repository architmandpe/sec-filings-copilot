# Hand-written eval questions, in the same format as the converted FinanceBench questions.
# Check after every edit:  python -m evals.own
#
# id           own-001, own-002, ... (never reuse or renumber: results refer to ids)
# type         text | table | computation | multi_hop | unanswerable
# question     as a user would ask it; name the company and fiscal year unless the question is about that ambiguity
# answer       the correct answer in words, with units
# answer_kind  number | yes_no | text | refuse   (unanswerable questions: refuse)
# answer_value numbers only: the value in the unit of the answer (391035 for "$391,035 million", 46.2 for "46.2%")
# filings      doc_names from data/corpus.jsonl the answer comes from (unanswerable: the filing a user would expect, or [])
# evidence     one entry per fact the answer needs: the filing and a quote copied from it; spacing, punctuation and
#              case don't matter, but the words and numbers must appear in that order (table rows: label then numbers)
# notes        how the answer was checked, or why the question is unanswerable

- id: own-001
  type: table
  question: What were Apple's total net sales in fiscal 2024?
  answer: $391,035 million
  answer_kind: number
  answer_value: 391035
  filings: [APPLE_2024_10K]
  evidence:
    - doc_name: APPLE_2024_10K
      text: Total net sales $ 391,035
  notes: Matches XBRL RevenueFromContractWithCustomerExcludingAssessedTax FY2024

- id: own-002
  type: computation
  question: What was Apple's gross margin percentage in fiscal 2024?
  answer: 46.2% (gross margin $180,683 million / net sales $391,035 million)
  answer_kind: number
  answer_value: 46.2
  filings: [APPLE_2024_10K]
  evidence:
    - doc_name: APPLE_2024_10K
      text: Total gross margin $ 180,683
    - doc_name: APPLE_2024_10K
      text: Total net sales $ 391,035
  notes: The filing also states it directly ("Total gross margin percentage 46.2 %")

- id: own-003
  type: multi_hop
  question: Which company spent more on research and development in fiscal 2023, Apple or Microsoft, and by how much?
  answer: Apple, by $2,720 million ($29,915 million vs $27,195 million)
  answer_kind: number
  answer_value: 2720
  filings: [APPLE_2023_10K, MICROSOFT_2023_10K]
  evidence:
    - doc_name: APPLE_2023_10K
      text: Research and development $ 29,915
    - doc_name: MICROSOFT_2023_10K
      text: Research and development $ 27,195
  notes: Fiscal years differ (Apple ends September 30, 2023; Microsoft June 30, 2023)

- id: own-004
  type: text
  question: Where are Apple's outsourcing partners that manufacture its hardware products primarily located, according to its fiscal 2024 10-K?
  answer: China mainland, India, Japan, South Korea, Taiwan and Vietnam
  answer_kind: text
  filings: [APPLE_2024_10K]
  evidence:
    - doc_name: APPLE_2024_10K
      text: Substantially all of the Company's hardware products are manufactured by outsourcing partners that are located primarily in China mainland, India, Japan, South Korea, Taiwan and Vietnam.
  notes: Item 1A Risk Factors

- id: own-005
  type: unanswerable
  question: How much was Apple's CEO paid in fiscal 2024?
  answer: Not in the 10-K. Item 11 (Executive Compensation) is incorporated by reference from the 2025 proxy statement, which is not in the corpus.
  answer_kind: refuse
  filings: [APPLE_2024_10K]
  evidence: []
  notes: Items 10-14 of every 10-K in the corpus point to the proxy statement (DEF 14A)

